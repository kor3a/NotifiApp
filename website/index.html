<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/allimIcon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Allim - Never forget your groceries again. Keep a grocery list for every store, get a reminder the moment you are nearby, share lists with your family, and let AI sort every item by aisle." />
    <meta name="theme-color" content="#0D0A1A" />
    <title>Allim - Grocery Lists with Location Reminders</title>
    <style>
      html,
      body {
        margin: 0;
        background-color: #0d0a1a;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0d0a1a;
      }
      #app-splash .spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #00d5de;
        animation: app-splash-spin 0.8s linear infinite;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash"><div class="spinner"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
